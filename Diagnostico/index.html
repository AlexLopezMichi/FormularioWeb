<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">

    <!-- Es opcional eliminar estos estilos o personalizarlos en su propia hoja de estilos 👍 -->
    <style>
        .autor {
            font-size: 11px;
            text-align: center;
        }

        .autor a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>

<body>
    <div id="successMessage" class="alert-success-popup d-none">
        <strong>✔ ¡Mensaje enviado!</strong> <br>
        Gracias por completar el formulario. ¡Nos pondremos en contacto pronto!
    </div>
    <form id="contactForm" action="enviar.php" method="POST" novalidate>
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card p-4 shadow-lg rounded-4" style="max-width: 600px; width: 100%;">
                <h3 class="text-dark fw-bold">Contáctanos</h3>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre <span class="requerido">*</span></label>
                        <input type="text" class="form-control" id="firstName" name="Nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido <span class="requerido">*</span></label>
                        <input type="text" class="form-control" id="lastName" name="Apellido" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección de correo electrónico <span class="requerido">*</span></label>
                    <input type="email" class="form-control" id="email" name="Correo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de consulta <label class="requerido">*</label></label>
                    <div class="d-flex gap-1 query-type-container">
                        <div class="form-check form-check-inline flex-grow-1 query-option">
                            <input class="form-check-input" type="radio" name="queryType" id="general"
                                value="Consulta General" required>
                            <label class="form-check-label" for="general">Consulta general</label>
                        </div>
                        <div class="form-check form-check-inline flex-grow-1 query-option">
                            <input class="form-check-input" type="radio" name="queryType" id="support"
                                value="Solicitud Soporte" required>
                            <label class="form-check-label" for="support">Solicitud de soporte</label>
                        </div>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Mensaje <span class="requerido">*</span></label>
                    <textarea class="form-control" id="message" name="Mensaje" rows="4" required></textarea>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="consent" name="Consentimiento" required>
                    <label class="form-check-label" for="consent">Autorizo para ser contactado por el equipo <span
                            class="requerido">*</span></label>
                </div>

                <button type="submit" class="btn btn-success w-100">Enviar</button>
            </div>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
